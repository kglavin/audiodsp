[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "audiodsp"
version = "0.1.0"
description = "Shared helpers for the audiodsp project notebooks"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[tool.setuptools]
packages = ["audiodsp"]
